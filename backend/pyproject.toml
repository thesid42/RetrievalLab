[project]
name = "retrievallab-api"
version = "0.1.0"
description = "Self-improving retrieval control plane for the Data & AI Hackathon"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
native = [
  "rocketride>=1.3,<2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.uvicorn]
factory = false

[tool.ruff]
line-length = 100
target-version = "py311"
